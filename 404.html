<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found · Oba Adelore</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<style>
:root{color-scheme:light;--paper:#fbf9f5;--ink:#303832;--muted:#63685f;--line:#dcded5;--accent:#3c5c49;--white:#fffefb;--dark:#33483a}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Segoe UI",Arial,sans-serif;font-size:16px;line-height:1.7}
main{max-width:1120px;margin:auto;padding:90px 48px}
.mark{font-family:Georgia,serif;font-size:22px;text-decoration:none;color:inherit;letter-spacing:-.4px}.mark span{color:var(--accent)}
h1{font-family:Georgia,"Times New Roman",serif;font-size:44px;font-weight:400;letter-spacing:-1px;line-height:1.15;margin:48px 0 16px}
p{color:var(--muted);max-width:520px;margin:0 0 28px}
.action{display:inline-flex;align-items:center;min-height:46px;padding:11px 20px;font-size:14px;font-weight:500;text-decoration:none;border-radius:3px;background:var(--accent);color:var(--white)}.action:hover{background:var(--dark)}
a:focus-visible{outline:3px solid #9e652e;outline-offset:5px}
@media(max-width:620px){main{padding:56px 24px}h1{font-size:36px}}
</style>
</head>
<body>
<main>
<a class="mark" href="/">Oba<span> Adelore</span></a>
<h1>Page not found</h1>
<p>The page you were looking for isn’t here. It may have moved, or the address may be mistyped.</p>
<a class="action" href="/">Go to the portfolio home page</a>
</main>
</body>
</html>
